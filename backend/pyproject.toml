[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accesspath-go"
version = "0.1.0"
description = "Local-AI accessibility companion for outdoor walking routes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "sqlmodel>=0.0.22,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
